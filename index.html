<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
import {getDatabase,ref,onValue,query,limitToLast} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAo9SpiWYTGR2t7uqWNT2v27kb3nl6Z5gM",
  authDomain: "multi--object-tracking.firebaseapp.com",
  databaseURL: "https://multi--object-tracking-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "multi--object-tracking",
  storageBucket: "multi--object-tracking.firebasestorage.app",
  messagingSenderId: "627693413866",
  appId: "1:627693413866:web:a790305e37a87bc52cbe93"
};

// Gate closes when distance drops below this value
const GATE_CLOSE_CM = 50;
const MAX_SCALE_CM  = 800;

const $ = id => document.getElementById(id);
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let stopLive = null;
let stopLogs = null;
let heartbeatTimer = null;
let lastPacketAt = 0;

function setConnection(ok, text) {
  $("dot").classList.toggle("live", ok);
  $("conn").textContent = text;
}

/* ---------- scene + metrics ---------- */
function updateScene(distance, gateClosed) {
  const d = Math.max(0, Math.min(MAX_SCALE_CM, Number(distance) || 0));
  const x = 60 + (d / MAX_SCALE_CM) * 500;
  $("train").setAttribute("transform", `translate(${x} 0)`);

  let angle = -50;            // -50 = open, 0 = closed
  let gate, approach, color;

  if (gateClosed) {
    angle = 0;
    gate = "CLOSED";
    approach = "VERY NEAR";
    color = "var(--red)";
  } else if (d < 80) {
    angle = -20;
    gate = "OPEN";
    approach = "APPROACHING";
    color = "var(--yellow)";
  } else {
    angle = -50;
    gate = "OPEN";
    approach = "CLEAR";
    color = "var(--green)";
  }

  $("gateArm").setAttribute("transform", `translate(821 233) rotate(${angle})`);
  $("gateStatus").textContent = gate;
  $("approach").textContent = approach;
  $("gateStatus").style.color = color;
  $("approach").style.color = color;

  $("sceneStatus").textContent = gateClosed
    ? `GATE CLOSED (< ${GATE_CLOSE_CM} CM)`
    : "GATE OPEN — MONITORING";
  $("sceneStatus").style.color = color;

  $("alarm").setAttribute("opacity", gateClosed ? "1" : d < 80 ? ".5" : ".15");

  $("bar").style.width = (d / MAX_SCALE_CM * 100) + "%";
  $("bar").style.background = color;
  $("scale").textContent = d + " cm";

  $("faultState").textContent = gateClosed
    ? "Gate is CLOSED"
    : "Gate is open";
  $("faultState").style.color = gateClosed ? "var(--red)" : "var(--green)";

  $("distanceHint").textContent = gateClosed
    ? "Below close threshold — logged"
    : d < 80 ? "Approaching close threshold"
             : "Well above close threshold";
}

function showLatest(v) {
  if (!v || v.distance_cm === undefined) {
    $("dbstatus").textContent = "Connected, but distance_cm is missing at /live.";
    return;
  }
  const d = Number(v.distance_cm);
  if (!Number.isFinite(d)) {
    $("dbstatus").textContent = "Invalid distance_cm value.";
    return;
  }

  // Trust the gate flag sent by the device; fall back to the local rule.
  const gateClosed = (v.gate_closed === true) || (d < GATE_CLOSE_CM);

  $("distance").textContent = d;

  const ts = Number(v.timestamp_ms || 0);
  $("updated").textContent =
    "Last browser update: " + new Date().toLocaleTimeString() +
    " • Device uptime: " + (ts / 1000).toFixed(1) + " s";

  $("dbstatus").textContent = "Receiving live data from /TF_Luna/live.";
  setConnection(true, "LIVE FIREBASE DATA");

  lastPacketAt = Date.now();
  updateScene(d, gateClosed);
}

/* ---------- log list ---------- */
function showLogs(v) {
  const el = $("logs");
  el.replaceChildren();

  const rows = v ? Object.entries(v).reverse() : [];
  $("count").textContent = rows.length + " records";

  if (!rows.length) {
    el.innerHTML = '<div class="empty">No gate-close records yet.</div>';
    return;
  }

  for (const [key, item] of rows) {
    const row = document.createElement("div");
    row.className = "log";

    const left = document.createElement("div");
    const strong = document.createElement("strong");
    strong.textContent = "GATE CLOSED • " + (item.distance_cm ?? "--") + " cm";

    const small = document.createElement("div");
    small.className = "muted";
    const ts = Number(item.timestamp_ms || 0);
    small.textContent = "uptime " + (ts / 1000).toFixed(1) + " s · " + key;

    left.append(strong, small);

    const badge = document.createElement("span");
    badge.className = "status";
    badge.style.color = "var(--red)";
    badge.textContent = "CLOSED";

    row.append(left, badge);
    el.append(row);
  }
}

/* ---------- connect / disconnect ---------- */
function connectDevice() {
  $("dbstatus").textContent = "Connecting…";
  try {
    disconnectDevice();

    stopLive = onValue(
      ref(db, "TF_Luna/live"),
      s => {
        if (s.exists()) showLatest(s.val());
        else {
          $("dbstatus").textContent = "No live data at /TF_Luna/live yet.";
          setConnection(false, "NO LIVE DATA");
        }
      },
      e => {
        $("dbstatus").textContent = "Live read error: " + e.message;
        setConnection(false, "DATABASE READ ERROR");
      }
    );

    stopLogs = onValue(
      query(ref(db, "TF_Luna/faults"), limitToLast(25)),
      s => showLogs(s.val()),
      e => { $("logs").textContent = "Log read error: " + e.message; }
    );

    lastPacketAt = Date.now();
    heartbeatTimer = setInterval(() => {
      if (Date.now() - lastPacketAt > 6000) {
        setConnection(false, "STALE — no live data for 6 s");
      }
    }, 2000);

    setConnection(false, "CONNECTED • WAITING FOR DATA");
  } catch (e) {
    $("dbstatus").textContent = "Firebase error: " + e.message;
    setConnection(false, "CONNECTION ERROR");
  }
}

function disconnectDevice() {
  if (stopLive)       { stopLive();       stopLive = null; }
  if (stopLogs)       { stopLogs();       stopLogs = null; }
  if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null; }
}

$("connect").addEventListener("click", connectDevice);
$("disconnect").addEventListener("click", () => {
  disconnectDevice();
  setConnection(false, "Disconnected");
  $("dbstatus").textContent = "Disconnected by user.";
});

$("dbstatus").textContent =
  "Authentication disabled. Press Connect; database rules must allow public reads.";
</script>
